name: Deploy Playground Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch from wod-wiki
        required: false
        default: dev
  repository_dispatch:
    types:
      - playground-preview

concurrency:
  group: wod-wiki-preview-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.client_payload.branch || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Resolve source branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${{ github.event.client_payload.branch || 'dev' }}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Building source branch: $BRANCH"

      - name: Clone wod-wiki
        run: |
          git clone --depth 1 --branch "${{ steps.branch.outputs.branch }}" \
            https://github.com/${{ github.repository_owner }}/wod-wiki.git \
            /tmp/wod-wiki

      - name: Install dependencies
        working-directory: /tmp/wod-wiki
        run: bun install --frozen-lockfile

      - name: Inject optional analytics tag
        working-directory: /tmp/wod-wiki
        env:
          G_TAG: ${{ vars.G_TAG }}
        run: |
          if [ -n "$G_TAG" ]; then
            sed -i "s/G-PROD-ID/$G_TAG/g" playground/index.html playground/receiver-rpc.html
          fi

      - name: Build playground
        working-directory: /tmp/wod-wiki
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://wod.wiki/api' }}
          VITE_CAST_APP_ID: ${{ vars.VITE_CAST_APP_ID }}
          # Preview is served from the custom-domain root https://preview.wod.wiki/
          # so the app must be built with root-relative asset paths.
          VITE_BASE_PATH: /
        run: bun run build:app

      - name: Stage pages output
        run: |
          rm -rf site
          mkdir -p site
          cp -R /tmp/wod-wiki/playground/dist/. site/

          # SPA fallback for direct deep links on GitHub Pages.
          cp site/index.html site/404.html

          # Legacy redirect for the previous subpath URL model.
          mkdir -p site/wod-wiki-preview
          cat > site/wod-wiki-preview/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0;url=/" />
              <title>Redirecting…</title>
            </head>
            <body>
              <script>window.location.replace('/');</script>
            </body>
          </html>
          HTML

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
